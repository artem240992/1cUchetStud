name: Update README with last commit info

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'   # не запускаться при коммитах, которые меняют только README

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get last commit info
        id: commit
        run: |
          echo "hash=$(git log -1 --format='%h')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --format='%s')" >> $GITHUB_OUTPUT

      - name: Append commit info to README.md
        run: |
          # Добавляем отступ (пустая строка) и информацию о коммите
          echo "" >> README.md                     # отступ перед блоком
          echo "**Commit:** \`${{ steps.commit.outputs.hash }}\`" >> README.md
          echo "" >> README.md                     # отступ между хешем и сообщением
          echo "${{ steps.commit.outputs.message }}" >> README.md
          echo "" >> README.md
          echo "*(auto-updated)*" >> README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update README with last commit info [skip ci]"
          file_pattern: README.md