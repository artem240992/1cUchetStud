# =============================================================================
# 📄 Workflow: Умное обновление README информацией о коммите
# =============================================================================
# Что делает:
#   1. Забирает сообщение последнего коммита (заголовок + тело)
#   2. Добавляет его в начало README.md в красивом оформлении
#   3. Избегает повторного добавления одного и того же коммита
#   4. Работает даже с самыми хитрыми символами в сообщении
# =============================================================================

name: 📘 Update README with commit info

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'Обработки/**'
      - '.github/**'

env:
  README_FILE: "README.md"
  FORMAT_STYLE: "quote"

jobs:
  smart-update-readme:
    name: 🧠 Интеллектуальное обновление README
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔍 Extract commit data from GitHub context
        id: commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA::7}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          
          echo "$COMMIT_MSG" > full_msg.txt
          head -n1 full_msg.txt > subject.txt
          tail -n +2 full_msg.txt > body.txt
          
          {
            echo "subject<<EOF_SUBJECT"
            cat subject.txt
            echo "EOF_SUBJECT"
            echo "body<<EOF_BODY"
            cat body.txt
            echo "EOF_BODY"
            echo "short_sha=$SHORT_SHA"
            echo "author=$AUTHOR"
          } >> $GITHUB_OUTPUT
          
          echo "commit_url=https://github.com/${{ github.repository }}/commit/$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: 🚦 Check if update is needed
        id: check
        run: |
          NEED_UPDATE="true"
          
          if echo "${{ steps.commit.outputs.subject }}" | grep -qi "\[skip readme\]"; then
            echo "⏭️  Коммит содержит [skip readme], пропускаем обновление"
            NEED_UPDATE="false"
          fi
          
          if [ ! -f "${{ env.README_FILE }}" ]; then
            echo "📄 Файл ${{ env.README_FILE }} не найден, будет создан"
            NEED_UPDATE="true"
          else
            if grep -q "${{ steps.commit.outputs.short_sha }}" "${{ env.README_FILE }}"; then
              echo "⚠️  Коммит ${{ steps.commit.outputs.short_sha }} уже присутствует в README, пропускаем"
              NEED_UPDATE="false"
            fi
          fi
          
          echo "need_update=$NEED_UPDATE" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # ИСПРАВЛЕННЫЙ ШАГ 4 — БЕЗ ПРЯМОЙ ПОДСТАНОВКИ МНОГОСТРОЧНЫХ ПЕРЕМЕННЫХ
      # ------------------------------------------------------------------------
      - name: 🎨 Build pretty commit block
        if: steps.check.outputs.need_update == 'true'
        run: |
          SHORT_SHA="${{ steps.commit.outputs.short_sha }}"
          AUTHOR="${{ steps.commit.outputs.author }}"
          URL="${{ steps.commit.outputs.commit_url }}"
          SUBJECT=$(cat subject.txt)
          
          if [ "${{ env.FORMAT_STYLE }}" = "quote" ]; then
            BLOCK="> **📌 [$SHORT_SHA]($URL)** · **$AUTHOR**  \n"
            BLOCK+="> **$SUBJECT**  \n"
            if [ -s body.txt ]; then
              BODY_QUOTED=$(sed 's/^/> /' body.txt)
              BLOCK+="$BODY_QUOTED\n"
            fi
            BLOCK+=">  \n---\n"
          else
            BLOCK="\`\`\`\n📦 Commit: $SHORT_SHA\n👤 Author: $AUTHOR\n📝 Message:\n$SUBJECT\n"
            if [ -s body.txt ]; then
              BLOCK+="$(cat body.txt)\n"
            fi
            BLOCK+="\`\`\`\n---\n"
          fi
          
          printf "%b" "$BLOCK" > new_block.txt
          echo "Блок сформирован:"
          cat new_block.txt

      - name: ✏️ Prepend block to README
        if: steps.check.outputs.need_update == 'true'
        run: |
          if [ -f "${{ env.README_FILE }}" ]; then
            cat new_block.txt "${{ env.README_FILE }}" > README.tmp
          else
            echo "# 📚 Репозиторий" > README.tmp
            echo "" >> README.tmp
            cat new_block.txt >> README.tmp
            echo "" >> README.tmp
            echo "## История изменений" >> README.tmp
          fi
          mv README.tmp "${{ env.README_FILE }}"
          echo "✅ README.md успешно обновлён"

      - name: 💾 Commit and push changes
        if: steps.check.outputs.need_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📚 docs: update README with commit ${{ steps.commit.outputs.short_sha }} [skip ci]"
          file_pattern: ${{ env.README_FILE }}
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions <actions@github.com>"
          skip_fetch: true

      - name: 📢 Summary output
        if: always()
        run: |
          if [ "${{ steps.check.outputs.need_update }}" = "true" ]; then
            echo "🎉 README успешно обновлён коммитом ${{ steps.commit.outputs.short_sha }}"
          else
            echo "ℹ️  Обновление README не потребовалось"
          fi