# ============================================================
# 📝 Workflow: Обновление README информацией о коммите
# ============================================================
# Этот workflow автоматически добавляет в начало README.md
# сообщение последнего коммита (заголовок и тело).
# Запускается при пуше в main (кроме изменений в README,
# папке Обработки и .github).
# ============================================================

name: 📄 Update README with commit message

# ------------------------------------------------------------
# 🚀 Триггеры запуска
# ------------------------------------------------------------
on:
  push:
    branches:
      - main                      # Только ветка main
    paths-ignore:                 # Игнорируем изменения в:
      - 'README.md'               #   самом README (избегаем циклов)
      - 'Обработки/**'            #   служебных обработках
      - '.github/**'              #   настройках GitHub Actions

# ------------------------------------------------------------
# 🧩 Определение задачи
# ------------------------------------------------------------
jobs:
  update-readme:
    name: 🔄 Обновление README.md
    runs-on: ubuntu-latest
    permissions:
      contents: write             # Разрешаем запись в репозиторий

    # --------------------------------------------------------
    # 📋 Шаги выполнения
    # --------------------------------------------------------
    steps:
      # 1️⃣ Клонирование репозитория
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # Только последний коммит (экономия времени)

      # 2️⃣ Извлечение полного сообщения последнего коммита
      - name: 🔍 Get full commit message
        id: commit                # ID для доступа к выходам
        run: |
          # --- Сохраняем полный текст коммита (заголовок + тело) ---
          git log -1 --format='%B' > commit_msg.txt
          
          # --- Извлекаем заголовок (первая строка) ---
          first_line=$(head -n1 commit_msg.txt)
          
          # --- Извлекаем тело (все остальные строки) ---
          tail -n +2 commit_msg.txt > commit_body.txt
          
          # --- Записываем заголовок в выходную переменную ---
          echo "subject=$first_line" >> $GITHUB_OUTPUT
          
          # --- Сохраняем тело с сохранением переносов строк (heredoc) ---
          {
            echo 'body<<EOF'
            cat commit_body.txt
            echo EOF
          } >> $GITHUB_OUTPUT

      # 3️⃣ Добавление информации о коммите в начало README.md
      - name: ✏️ Prepend commit info to README
        run: |
          # --- Формируем красивый блок с рамкой ---
          if [ -s commit_body.txt ]; then
            # Если есть тело коммита, выводим его с разделителями
            NEW_BLOCK=$(cat <<-END
            ========================================
            📌 ${{ steps.commit.outputs.subject }}
            ========================================
            
            ${{ steps.commit.outputs.body }}
            
            ----------------------------------------
            
            END
            )
            # Записываем блок + существующее содержимое README
            printf "%s\n%s\n" "$NEW_BLOCK" "$(cat README.md)" > README.md
          else
            # Если только заголовок — компактный вариант
            NEW_BLOCK=$(cat <<-END
            ========================================
            📌 ${{ steps.commit.outputs.subject }}
            ========================================
            
            
            END
            )
            printf "%s\n%s\n" "$NEW_BLOCK" "$(cat README.md)" > README.md
          fi

      # 4️⃣ Коммит и пуш изменений обратно в репозиторий
      - name: 💾 Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📚 docs: update README with commit info [skip ci]"
          file_pattern: README.md
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions <actions@github.com>"