# .github/workflows/ci.yml
name: 1C CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Установка OneScript (кросс-платформенный скриптовый движок для 1С)
      - name: Setup OneScript
        uses: otymko/setup-onescript@v2
        with:
          version: 1.9.0   # актуальная версия на момент написания

      # 3. Установка зависимостей через менеджер пакетов opm
      - name: Install dependencies
        run: opm install

      # 4. Линтинг и синтаксический контроль с помощью BSL Language Server
      - name: BSL Linter
        uses: otymko/bsl-ls-action@v2
        with:
          source-path: ./src               # путь к исходникам 1С
          report-name: bsl-lint-report
          fail-on-error: true               # останавливать при ошибках

      # 5. Запуск модульных тестов через Vanessa Automation
      #    Предполагается, что в корне лежит каталог tests/vanessa
      #    и настроен скрипт запуска (например, tasks/vanessa-runner.os)
      - name: Run Vanessa Automation tests
        run: |
          oscript ./tasks/vanessa-runner.os run \
            --vanessasettings ./tools/vanessa-runner.json \
            --path ./tests/vanessa

      # 6. (Опционально) Сборка дистрибутива поставки
      - name: Build distribution
        run: |
          # пример: создание cf-файла из исходников
          oscript ./tasks/build-distribution.os
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

      # 7. Загрузка артефактов сборки (например, cf-файла)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: distribution
          path: ./build/*.cf
